name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        id: find
        run: |
          mkdir -p /tmp/proj
          z=$(find . -maxdepth 2 -iname '*.zip' | head -n1)
          if [ -n "$z" ]; then
            echo "Zip табылды: $z"
            unzip -q -o "$z" -d /tmp/proj
          else
            echo "Zip жоқ, репозиторий түбірін қолданамын"
            cp -r . /tmp/proj
          fi
          f=$(find /tmp/proj -name build.gradle | head -n1)
          if [ -z "$f" ]; then echo "build.gradle табылмады"; ls -R /tmp/proj | head -50; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon --console=plain 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Show only errors
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -n -E "error:|What went wrong|Execution failed|Caused by|cannot find symbol|package .* does not exist" /tmp/build.log | head -60
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Copy jar
        run: |
          mkdir -p out
          cp ${{ steps.find.outputs.dir }}/build/libs/*.jar out/
          rm -f out/*-sources.jar

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: AlihVisuals-jar
          path: out/*.jar
          if-no-files-found: error
