name: AlihVisuals Auto Build

on:
push:
branches: [main, master]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download Repository
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.2.1'

  - name: Extract AlihVisuals
    run: |
      unzip -q AlihVisuals.zip -d extracted
      ls -la extracted

  - name: Build Mod
    run: |
      gradle -p extracted/AlihVisuals clean build

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: AlihVisuals-Build
      path: extracted/AlihVisuals/build/libs/*.jar
      if-no-files-found: error
