name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        id: find
        run: |
          mkdir -p /tmp/proj
          z=$(find . -maxdepth 2 -iname '*.zip' | head -n1)
          if [ -n "$z" ]; then
            echo "Zip табылды: $z"
            unzip -q -o "$z" -d /tmp/proj
          else
            echo "Zip жоқ, репозиторий түбірін қолданамын"
            cp -r . /tmp/proj
          fi
          f=$(find /tmp/proj -name build.gradle | head -n1)
          if [ -z "$f" ]; then echo "build.gradle табылмады"; ls -R /tmp/proj | head -50; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Init script (show all compile errors)
        run: |
          cat > /tmp/init.gradle <<'EOF'
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              options.compilerArgs += ['-Xmaxerrs', '5000', '-Xmaxwarns', '0']
            }
          }
          EOF

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon --console=plain -I /tmp/init.gradle 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Collect errors
        if: always()
        run: |
          grep -E "error:|What went wrong" -A2 /tmp/build.log > /tmp/errors.txt || true
          {
            echo '## Build errors'
            echo "Errors: $(grep -c 'error:' /tmp/build.log || true)"
            echo '```'
            grep -E "error:" /tmp/build.log | sed 's#/tmp/proj/src/main/java/kz/alih/visuals/##' | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/build.log
            /tmp/errors.txt

      - name: Copy jar
        run: |
          mkdir -p out
          cp ${{ steps.find.outputs.dir }}/build/libs/*.jar out/
          rm -f out/*-sources.jar

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: AlihVisuals-jar
          path: out/*.jar
          if-no-files-found: error
