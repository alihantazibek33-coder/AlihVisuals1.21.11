name: AlihVisuals Build

'on':
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.2.1'

  - name: Extract ZIP
    run: |
      unzip -q AlihVisuals.zip -d extracted
      find extracted -name build.gradle -o -name build.gradle.kts

  - name: Build Mod
    run: |
      DIR=$(dirname "$(find extracted -name build.gradle -o -name build.gradle.kts | head -n 1)")
      gradle -p "$DIR" clean build

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: AlihVisuals-Build
      path: extracted/**/build/libs/*.jar
      if-no-files-found: error
